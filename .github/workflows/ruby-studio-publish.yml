name: Ruby Studio Publish

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Ruby Studio Desktop run ID containing all four distributions
        required: true
        type: string
      tag:
        description: New release tag (for example v0.1.0)
        required: true
        type: string
      mode:
        description: Verify only, save a draft, or publish a prerelease/stable release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
          - release
          - verify-only

permissions:
  contents: read

concurrency:
  group: ruby-studio-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify tested packages and create the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: node scripts/publish-ruby-studio.mjs --run-id "$BUILD_RUN_ID" --tag "$RELEASE_TAG" --mode "$RELEASE_MODE"
