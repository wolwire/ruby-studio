[package]
name = "ruby-studio-lexer"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Ruby Studio native lexer and portable SDK archive worker"

[dependencies]
sevenz-rust2 = { version = "=0.24.0", default-features = false, features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
